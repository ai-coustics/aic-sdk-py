name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.libc && format('{0} ', matrix.libc) || '' }}wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            libc: gnu
            targets: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
            interpreters: '3.10 3.11 3.12 3.13 3.14 3.15'
            use-zig: true
          - os: ubuntu-latest
            libc: musl
            targets: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
            interpreters: '3.10 3.11 3.12 3.13 3.14 3.15'
            use-zig: true
          - os: macos-latest
            libc: ''
            targets: x86_64-apple-darwin aarch64-apple-darwin
            interpreters: '3.10 3.11 3.12 3.13 3.14 3.15'
            use-zig: false
          - os: windows-latest
            libc: ''
            targets: x86_64-pc-windows-msvc aarch64-pc-windows-msvc
            interpreters: '3.10 3.11 3.12 3.13 3.14 3.15'
            use-zig: false
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}

      - name: Install Python interpreters
        shell: bash
        run: uv python install ${{ matrix.interpreters }}

      - name: Build wheels
        shell: bash
        run: |
          for target in ${{ matrix.targets }}; do
            echo "Building for $target"
            if [ "${{ matrix.use-zig }}" = "true" ]; then
              uvx --from maturin[zig] maturin build --zig --release --target $target --out dist --interpreter ${{ matrix.interpreters }}
            else
              uvx maturin build --release --target $target --out dist --interpreter ${{ matrix.interpreters }}
            fi
          done

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          # Artifact names must be unique across the glibc and musl jobs.
          name: wheels-${{ matrix.os }}${{ matrix.libc && format('-{0}', matrix.libc) || '' }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Build sdist
        run: uvx maturin sdist --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, sdist]
    environment: publish
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          generate_release_notes: true
